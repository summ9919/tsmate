name: Build TSMate (IPA / TIPC)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tsmate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS App (unsigned -> ad-hoc sign)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: TSMate
      APP_NAME: TSMate
      BUNDLE_ID: com.niugit.tsmate
      MARKETING_VERSION: "1.0.0"
      BUILD_NUMBER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen + ldid
        run: |
          brew install xcodegen
          xcodegen --version
          (brew install ldid && ldid 2>&1 | head -2) || echo "ldid not installed, will skip pseudo-sign"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, deployment target iOS 16.0)
        run: |
          set -o pipefail
          xcodebuild \
            -project TSMate.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log

      - name: Ad-hoc sign (codesign + ldid, non-fatal)
        run: |
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP" || { echo "app bundle not found"; exit 1; }
          cp scripts/entitlements.plist build/entitlements.plist
          codesign --force --deep --sign - "$APP" || echo "codesign skipped"
          ldid -Sbuild/entitlements.plist "$APP" || echo "ldid skipped"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Package .ipa and .tipc
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          rm -rf pkg
          mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          cd pkg
          zip -qry "../$APP_NAME-$MARKETING_VERSION.ipa" Payload
          cd ..
          cp "$APP_NAME-$MARKETING_VERSION.ipa" "$APP_NAME-$MARKETING_VERSION.tipc"
          ls -lh *.ipa *.tipc
          unzip -l "$APP_NAME-$MARKETING_VERSION.ipa" | head -15

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSMate-${{ env.MARKETING_VERSION }}
          path: |
            ${{ env.APP_NAME }}-${{ env.MARKETING_VERSION }}.ipa
            ${{ env.APP_NAME }}-${{ env.MARKETING_VERSION }}.tipc
          if-no-files-found: error
